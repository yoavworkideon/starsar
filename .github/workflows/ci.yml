name: ci

# Cloud CI — runs in GitHub Actions so tests run regardless of whether the Mac is on.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'   # nightly ~02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt || true
          [ -f requirements-agents.txt ] && pip install -r requirements-agents.txt || true
          pip install pytest
      - name: Run tests
        run: |
          set +e
          pytest -q
          code=$?
          # exit 5 = "no tests collected" -> treat as success, not failure
          if [ $code -eq 5 ]; then echo "::notice::no tests collected"; exit 0; fi
          exit $code
